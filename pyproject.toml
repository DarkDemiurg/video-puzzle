[project]
name = "video-puzzle"
version = "0.1.1"
description = "Desktop app that tiles videos into a mosaic (puzzle layouts or a video wall) via ffmpeg"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Dmitriy Efimov", email = "efimov@qtech.ru" }
]
requires-python = ">=3.12"
keywords = ["video", "ffmpeg", "mosaic", "video-wall", "pyside6"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=2.5.2",
    "pyside6>=6.11.2",
]

[project.urls]
Homepage = "https://github.com/DarkDemiurg/video-puzzle"
Issues = "https://github.com/DarkDemiurg/video-puzzle/issues"

[project.scripts]
video-puzzle = "video_puzzle:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.mypy]
python_version = "3.12"
files = ["src/video_puzzle"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_close_prompt: exercise the real unsaved-changes close prompt"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["video_puzzle"]

[tool.ruff.lint.per-file-ignores]
# A translation catalog is data: long source/translation strings are intentional.
"src/video_puzzle/translations/*.py" = ["E501"]
